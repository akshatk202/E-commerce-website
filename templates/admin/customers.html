{% extends 'base.html' %}
{% block title %}Admin Customers - E-Commerce{% endblock %}
{% block content %}
<h2>Customers</h2>
<div class="card">
  <div class="card-body">
    <table class="table table-striped">
      <thead>
        <tr>
          <th>Email</th>
          <th>Name</th>
          <th>Joined</th>
        </tr>
      </thead>
      <tbody>
        {% for c in customers %}
          <tr>
            <td>{{ c.email }}</td>
            <td>{{ c.full_name }}</td>
            <td>{{ c.created_at.strftime('%Y-%m-%d') }}</td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
