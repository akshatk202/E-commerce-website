{% extends 'base.html' %}
{% block title %}Admin Feedback - E-Commerce{% endblock %}
{% block content %}
<h2>Customer Feedback</h2>
<div class="card">
  <div class="card-body">
    <div class="list-group">
      {% for f in items %}
        <div class="list-group-item">
          <div class="d-flex justify-content-between">
            <div>
              <div class="fw-semibold">{{ f.user.email }}</div>
              <div class="text-muted">{{ f.created_at.strftime('%Y-%m-%d %H:%M') }}</div>
            </div>
            <div>
              <span class="badge text-bg-primary">Rating: {{ f.rating }}</span>
            </div>
          </div>
          <div class="mt-2">{{ f.message }}</div>
        </div>
      {% endfor %}
    </div>
  </div>
</div>
{% endblock %}
