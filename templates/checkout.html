{% extends 'base.html' %}
{% block title %}Checkout - E-Commerce{% endblock %}
{% block content %}
<h2>Checkout</h2>

<div class="card">
  <div class="card-body">
    <h5 class="mb-3">Order summary</h5>
    <ul class="list-group list-group-flush mb-3">
      {% for p, q in items %}
        <li class="list-group-item d-flex justify-content-between">
          <span>{{ p.name }} × {{ q }}</span>
          <span>{{ ((p.price_cents*q)/100)|round(2) }} $</span>
        </li>
      {% endfor %}
    </ul>
    <div class="d-flex justify-content-between">
      <strong>Total</strong>
      <strong>{{ (total_cents/100)|round(2) }} $</strong>
    </div>

    <form method="post" class="mt-3">
      <button class="btn btn-success w-100" type="submit">Place order (demo)</button>
    </form>
  </div>
</div>
{% endblock %}
